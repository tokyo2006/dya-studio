# Fork-only: rebuild `personal` = upstream main + every pr/* branch of this fork.
name: Sync personal branch

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: Release and build installers even if personal did not change
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-personal
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tokyo2006/dya-studio'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: cormoran/dya-studio
      UPSTREAM_BRANCH: main
      PREFIX: pr/
      TARGET: personal
    steps:
      # GITHUB_TOKEN cannot push commits that touch .github/workflows, so a PAT
      # with Contents + Workflows write is required.
      - name: Require SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Secret SYNC_TOKEN is not set"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Rebuild and push
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git checkout -B "$TARGET" "upstream/$UPSTREAM_BRANCH"

          branches=$(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/$PREFIX")
          if [ -z "$branches" ]; then
            echo "::error::No origin/$PREFIX* branches"
            exit 1
          fi

          # Skip when nothing changed, so a conflict resolved locally is not rebuilt away.
          if git rev-parse -q --verify "origin/$TARGET" >/dev/null; then
            up_to_date=1
            for ref in "upstream/$UPSTREAM_BRANCH" $branches; do
              git merge-base --is-ancestor "$ref" "origin/$TARGET" || up_to_date=0
            done
            if [ "$up_to_date" = 1 ]; then
              echo "origin/$TARGET already contains upstream and all $PREFIX* branches"
              exit 0
            fi
          fi

          for b in $branches; do
            echo "==> merging $b"
            if ! git merge --no-ff --no-edit "$b"; then
              echo "::error::Conflict merging $b. Run 'git sync-personal' locally to resolve and push."
              git diff --name-only --diff-filter=U
              exit 1
            fi
          done

          git push -f origin "$TARGET"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      # Same flow as a manual release: tag personal, create a Release, and let
      # electron.yml attach the installers to it.
      - name: Release and build desktop app
        if: steps.sync.outputs.updated == 'true' || inputs.force_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "$TARGET"
          SHA=$(git rev-parse "origin/$TARGET")
          TAG_PREFIX="v$(date -u +%Y.%m.%d)-$TARGET."
          N=$(git ls-remote --tags origin "refs/tags/$TAG_PREFIX*" \
            | sed -E "s#.*refs/tags/$TAG_PREFIX##; s#\^\{\}##" | sort -n | tail -1)
          TAG="$TAG_PREFIX$(( ${N:-0} + 1 ))"

          git tag -a -m "$TAG" "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes "Automated build of $TARGET at $SHA"
          gh workflow run electron.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET" -f release_tag="$TAG"
          echo "Released $TAG; installer build dispatched" >> "$GITHUB_STEP_SUMMARY"
